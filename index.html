<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Supabase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kotak-login">
    <h2>Masuk Akun</h2>
    <form id="formLogin">
      <div class="grup-input">
        <label>Email</label>
        <input type="email" id="email" required placeholder="contoh@email.com">
      </div>
      <div class="grup-input">
        <label>Kata Sandi</label>
        <input type="password" id="sandi" required placeholder="Masukkan kata sandi">
      </div>
      <button type="submit">Masuk</button>
      <p id="pesan"></p>
      <p class="tautan">Belum punya akun? <a href="#" id="linkDaftar">Daftar di sini</a></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
