<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Game - Space Clicker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #0a0a1a 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(72, 187, 255, 0.2);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .score-box {
            background: #1a1f2e;
            border-radius: 60px;
            padding: 12px 24px;
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-label {
            color: #8b9dc3;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .score-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: #00e0ff;
            text-shadow: 0 0 8px #00aaff;
            line-height: 1;
        }

        .highscore {
            font-size: 0.8rem;
            color: #ffd966;
            margin-left: 12px;
        }

        .canvas-area {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        canvas {
            background: #0c1122;
            border-radius: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.05);
            cursor: pointer;
            width: 100%;
            height: auto;
            border: 1px solid rgba(0, 255, 255, 0.4);
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tg-btn {
            background: linear-gradient(135deg, #2b5876, #1e3a5f);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            font-family: inherit;
        }

        .tg-btn:active {
            transform: scale(0.96);
        }

        .tg-btn.primary {
            background: linear-gradient(135deg, #0088cc, #005f8c);
            box-shadow: 0 0 12px rgba(0,136,204,0.5);
        }

        .status {
            background: rgba(0,0,0,0.5);
            border-radius: 32px;
            padding: 12px;
            text-align: center;
            font-size: 0.8rem;
            color: #aaccff;
        }

        .telegram-log {
            font-size: 0.7rem;
            color: #5f7f9f;
            margin-top: 12px;
            text-align: center;
            word-break: break-word;
        }

        @media (max-width: 480px) {
            .game-container { padding: 16px; }
            .score-value { font-size: 1.8rem; }
            .tg-btn { padding: 8px 18px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="score-box">
            <span class="score-label">⭐ SKOR</span>
            <span class="score-value" id="scoreDisplay">0</span>
            <span class="highscore" id="highScoreSpan">🏆 PB: 0</span>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="gameCanvas" width="450" height="450" style="width:100%; height:auto; max-width:450px; aspect-ratio:1/1"></canvas>
    </div>

    <div class="controls">
        <button class="tg-btn" id="resetBtn">🔄 Ulang Game</button>
        <button class="tg-btn primary" id="sendScoreBtn">📤 Kirim Skor ke Telegram</button>
    </div>
    <div class="status" id="gameStatus">
        ✨ Klik pada bintang biru / target untuk mendapat skor!
    </div>
    <div class="telegram-log" id="telegramLog">
        💡 Skor akan dikirim ke bot Telegram saat tombol ditekan.
    </div>
</div>

<script>
    // ========================
    // GAME: STAR CATCHER (Klik target)
    // ========================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const highScoreSpan = document.getElementById('highScoreSpan');
    const gameStatusDiv = document.getElementById('gameStatus');
    const telegramLogDiv = document.getElementById('telegramLog');

    // Ukuran canvas (fixed 450x450)
    const SIZE = 450;
    canvas.width = SIZE;
    canvas.height = SIZE;

    let score = 0;
    let highScore = localStorage.getItem('tgGameHighScore') ? parseInt(localStorage.getItem('tgGameHighScore')) : 0;
    highScoreSpan.innerText = `🏆 PB: ${highScore}`;

    // Target object
    let target = {
        x: SIZE/2,
        y: SIZE/2,
        radius: 24,
        active: true
    };

    // Animasi partikel sederhana untuk efek klik
    let particles = [];

    // Fungsi generate posisi random
    function randomPosition() {
        const margin = target.radius + 8;
        return {
            x: Math.random() * (SIZE - margin * 2) + margin,
            y: Math.random() * (SIZE - margin * 2) + margin
        };
    }

    // Pindah target ke posisi baru
    function relocateTarget() {
        const newPos = randomPosition();
        target.x = newPos.x;
        target.y = newPos.y;
        // efek visual tidak diperlukan reset radius
    }

    // Tambah skor
    function addScore(points) {
        score += points;
        scoreSpan.innerText = score;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('tgGameHighScore', highScore);
            highScoreSpan.innerText = `🏆 PB: ${highScore}`;
            gameStatusDiv.innerHTML = '🎉 REKOR BARU! 🎉';
            setTimeout(() => {
                if (gameStatusDiv) gameStatusDiv.innerHTML = '✨ Klik pada bintang biru / target untuk mendapat skor!';
            }, 1200);
        } else {
            gameStatusDiv.innerHTML = `+${points} ✨ Skor: ${score}`;
            setTimeout(() => {
                if (gameStatusDiv && !gameStatusDiv.innerHTML.includes('REKOR')) 
                    gameStatusDiv.innerHTML = '✨ Klik pada bintang biru / target untuk mendapat skor!';
            }, 600);
        }
    }

    // Reset game
    function resetGame() {
        score = 0;
        scoreSpan.innerText = "0";
        gameStatusDiv.innerHTML = "🔄 Game direset. Mulai klik!";
        relocateTarget();
        particles = [];
        setTimeout(() => {
            if (gameStatusDiv) gameStatusDiv.innerHTML = '✨ Klik pada bintang biru / target untuk mendapat skor!';
        }, 800);
    }

    // Efek partikel saat klik
    function addExplosion(px, py) {
        for (let i = 0; i < 12; i++) {
            particles.push({
                x: px, y: py,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 1.5,
                life: 1.0,
                size: Math.random() * 5 + 2,
                color: `hsl(${Math.random() * 60 + 200}, 80%, 60%)`
            });
        }
    }

    // Update partikel
    function updateParticles() {
        for (let i = 0; i < particles.length; i++) {
            particles[i].x += particles[i].vx;
            particles[i].y += particles[i].vy;
            particles[i].life -= 0.03;
            if (particles[i].life <= 0 || particles[i].y > SIZE + 50 || particles[i].x < -50) {
                particles.splice(i,1);
                i--;
            }
        }
    }

    // Draw target (bintang / inti ungu kebiruan)
    function drawTarget() {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#3b82f6";
        // Lingkaran gradasi
        const grad = ctx.createRadialGradient(target.x-5, target.y-5, 5, target.x, target.y, target.radius);
        grad.addColorStop(0, '#3b82f6');
        grad.addColorStop(1, '#1e3a8a');
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.radius, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.radius-4, 0, Math.PI*2);
        ctx.fillStyle = '#60a5fa';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.radius-8, 0, Math.PI*2);
        ctx.fillStyle = '#bfdbfe';
        ctx.fill();
        // mata lucu
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(target.x-8, target.y-6, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(target.x+8, target.y-6, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(target.x-9, target.y-7, 1, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(target.x+7, target.y-7, 1, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    // Background bintang gelap
    function drawBackground() {
        ctx.fillStyle = '#0c1122';
        ctx.fillRect(0,0,SIZE,SIZE);
        for(let i=0;i<80;i++) {
            if (i%2 === 0) continue;
            ctx.fillStyle = `rgba(255,255,200,${Math.random()*0.5+0.2})`;
            ctx.beginPath();
            ctx.arc( (i*131)%SIZE, (i*253)%SIZE, 1.5, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function drawParticles() {
        for (let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Animasi loop
    function animate() {
        drawBackground();
        drawTarget();
        drawParticles();
        updateParticles();
        requestAnimationFrame(animate);
    }

    // Event klik canvas
    function handleCanvasClick(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
            e.preventDefault();
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        let canvasX = (clientX - rect.left) * scaleX;
        let canvasY = (clientY - rect.top) * scaleY;
        if (canvasX >= 0 && canvasX <= SIZE && canvasY >= 0 && canvasY <= SIZE) {
            const dx = canvasX - target.x;
            const dy = canvasY - target.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if (dist <= target.radius) {
                // klik tepat pada target
                addScore(1);
                addExplosion(target.x, target.y);
                relocateTarget();
            }
        }
    }

    canvas.addEventListener('click', handleCanvasClick);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let canvasX = (touch.clientX - rect.left) * scaleX;
        let canvasY = (touch.clientY - rect.top) * scaleY;
        if (canvasX >= 0 && canvasX <= SIZE && canvasY >= 0 && canvasY <= SIZE) {
            const dx = canvasX - target.x;
            const dy = canvasY - target.y;
            if (Math.hypot(dx,dy) <= target.radius) {
                addScore(1);
                addExplosion(target.x, target.y);
                relocateTarget();
            }
        }
    }, {passive: false});

    document.getElementById('resetBtn').addEventListener('click', () => resetGame());
    
    // ========================
    // INTEGRASI TELEGRAM BOT (mengirim skor)
    // ========================
    // GANTI DENGAN TOKEN BOT DAN CHAT ID YANG SESUAI
    // Untuk keperluan demo, gunakan mekanisme WebApp data atau bisa kirim ke endpoint sendiri.
    // Disini kita gunakan fetch ke bot Telegram (harus disetup)
    // Catatan: Untuk keamanan, sebaiknya lakukan via backend proxy. Tapi demo ini mengirim langsung.
    // Anda perlu mengganti BOT_TOKEN dan CHAT_ID dengan milik sendiri.
    const BOT_TOKEN = "NzkwNDA1NDcyNDpBQUhCb25WODY0X2xTeUtoR09KcUMyY3F6c2wtdThKdHotMA==";   // Ganti dengan token bot Telegram
    const CHAT_ID = "6621286522";       // Ganti dengan ID chat user / group

    async function sendScoreToTelegram(playerScore) {
        if (!BOT_TOKEN || BOT_TOKEN === "YOUR_BOT_TOKEN_HERE") {
            telegramLogDiv.innerHTML = "⚠️ Konfigurasi Bot Token belum diatur. Ganti BOT_TOKEN & CHAT_ID di script.";
            console.warn("Token belum diisi");
            return false;
        }
        const message = `🎮 *Telegram Game Score* 🎮\nSkor terbaru: *${playerScore}* poin\n🏆 Tertinggi: *${highScore}*\n✨ Selamat bermain! ✨`;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });
            const data = await response.json();
            if (data.ok) {
                telegramLogDiv.innerHTML = "✅ Skor berhasil dikirim ke Telegram Bot! ✅";
                setTimeout(() => {
                    if (telegramLogDiv) telegramLogDiv.innerHTML = "💡 Skor akan dikirim ke bot Telegram saat tombol ditekan.";
                }, 3000);
                return true;
            } else {
                telegramLogDiv.innerHTML = `❌ Gagal: ${data.description}`;
                return false;
            }
        } catch (err) {
            telegramLogDiv.innerHTML = `⚠️ Error koneksi: ${err.message}`;
            return false;
        }
    }

    const sendBtn = document.getElementById('sendScoreBtn');
    sendBtn.addEventListener('click', async () => {
        gameStatusDiv.innerHTML = "📤 Mengirim skor ke Telegram...";
        const success = await sendScoreToTelegram(score);
        if (success) {
            gameStatusDiv.innerHTML = "✔️ Skor terkirim!";
        } else {
            gameStatusDiv.innerHTML = "❌ Gagal kirim, cek token/chat ID.";
        }
        setTimeout(() => {
            if (gameStatusDiv && !gameStatusDiv.innerHTML.includes('REKOR'))
                gameStatusDiv.innerHTML = "✨ Klik pada bintang biru / target untuk mendapat skor!";
        }, 2000);
    });

    // Mulai game
    relocateTarget();
    animate();
</script>
</body>
</html>
