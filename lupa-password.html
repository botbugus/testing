<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Password · UIX Design</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Particle Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Lupa Password Card -->
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">🔑</div>
            <h1>UX<span>·</span>Core</h1>
        </div>
        <div class="subhead">Reset Kata Sandi</div>

        <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:24px; text-align:center;">
            Masukkan email Anda, kami akan kirimkan instruksi reset password.
        </p>

        <form id="lupaPasswordForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" placeholder="nama@email.com" required />
            </div>

            <button type="submit" class="btn-login" id="resetBtn">
                <span id="btnText">Kirim Instruksi</span>
                <span id="btnLoader" style="display:none;">⏳</span>
            </button>

            <div class="status-msg" id="statusMsg"></div>
        </form>

        <div class="footer-links">
            <a href="index.html">← Kembali ke Login</a>
            <a href="daftar.html">Belum punya akun? Daftar</a>
        </div>
    </div>

    <!-- JS -->
    <script src="particles.js"></script>
    <script src="lupa-password.js"></script>
</body>
</html>
